spring.application.name=question-bank
spring.datasource.url=jdbc:h2:mem:questionbankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo data used by the README curl examples. Disabled in tests.
questionbank.seed.enabled=true
